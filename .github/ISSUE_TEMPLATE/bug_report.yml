name: Bug report
description: Report incorrect behavior or a false positive
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Velocity version, placeholder: "0.2.0" }
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes: { label: Platform, options: [Linux, Windows, macOS] }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Minimal reproduction, description: Include the command, config, source fixture, output, and expected behavior. }
    validations: { required: true }
