name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  quality-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - run: npm run validate:schemas
      - run: node bin/velocity.js check . --no-color
      - name: Validate generated analysis JSON
        run: |
          node bin/velocity.js analyze . --format json --save analysis-report.json >/dev/null
          node scripts/validate-schemas.js schemas/analysis-report.schema.json analysis-report.json
      - run: node bin/velocity.js analyze . --format sarif --save velocity.sarif
      - name: Pack and smoke-test the published surface
        shell: bash
        run: |
          expected_version=$(node -p "require('./package.json').version")
          package_file=$(npm pack --silent)
          package_path="$PWD/$package_file"
          temp_dir=$(mktemp -d)
          cd "$temp_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts "$package_path"
          test "$(npx velocity --version)" = "$expected_version"
          printf 'export const value = 1;\n' > index.js
          npx velocity analyze . --format json > report.json
          node -e 'const report = require("./report.json"); if (report.schemaVersion !== 1) process.exit(1)'
          printf 'import { getRuleCatalog } from "@wess2001/velocity"; if (!getRuleCatalog().length) process.exit(1);\n' > consumer.mjs
          node consumer.mjs
          npm install --save-dev typescript @types/node
          printf 'import { analyzeProject } from "@wess2001/velocity"; void analyzeProject(".");\n' > consumer.ts
          npx tsc --noEmit --module NodeNext --moduleResolution NodeNext --target ES2022 consumer.ts

  browser-and-schemas:
    name: Chromium smoke · Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate:schemas
      - name: Install the playwright-core Chromium revision
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Resolve the exact Chromium executable
        shell: bash
        run: |
          chrome_path=$(node --input-type=module -e "import { chromium } from 'playwright-core'; process.stdout.write(chromium.executablePath())")
          printf 'CHROME_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"
      - name: Generate a local self-signed certificate
        shell: bash
        run: |
          mkdir -p .velocity-ci-tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .velocity-ci-tls/key.pem -out .velocity-ci-tls/cert.pem -days 1 -subj "/CN=127.0.0.1" >/dev/null 2>&1
      - name: Run mandatory real-browser HTTP and HTTPS smoke
        env:
          VELOCITY_TLS_KEY: .velocity-ci-tls/key.pem
          VELOCITY_TLS_CERT: .velocity-ci-tls/cert.pem
        run: node scripts/browser-smoke.js
      - name: Validate the generated load report against its schema
        run: node scripts/validate-schemas.js schemas/load-report.schema.json load-smoke.json
