name: Real Terminal Proof

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROOF_TITLE: "Velocity — real CLI"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Prepare real CLI commands
        run: |
          cat > /tmp/run-proof.sh <<'SH'
          #!/usr/bin/env bash
          cd "$GITHUB_WORKSPACE"
          clear
          {
            printf '$ node bin/velocity.js analyze examples/problematic-api --no-color\n\n'
            node bin/velocity.js analyze examples/problematic-api --no-color
            printf '\n$ node bin/velocity.js check examples/problematic-api --min-score 90 --no-color\n\n'
            set +e
            node bin/velocity.js check examples/problematic-api --min-score 90 --no-color
            CODE=$?
            set -e
            printf '\nexit=%s  ← gate blocks the problematic fixture\n' "$CODE"
          } 2>&1 | tee artifacts/proof.txt
          touch /tmp/proof.done
          exit 0
          SH

      - name: Install terminal screenshot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xterm scrot

      - name: Capture actual terminal window
        shell: bash
        run: |
          mkdir -p artifacts
          chmod +x /tmp/run-proof.sh
          Xvfb :99 -screen 0 1440x900x24 -ac >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 1

          xterm             -fa "DejaVu Sans Mono"             -fs 10             -geometry 166x49+0+0             -bg "#090909"             -fg "#ece9e2"             -bd "#202020"             -cr "#ece9e2"             -sb             -sl 3000             -hold             -T "$PROOF_TITLE"             -e /tmp/run-proof.sh &
          XTERM_PID=$!

          for i in $(seq 1 120); do
            if [ -f /tmp/proof.done ]; then break; fi
            sleep 0.5
          done

          test -f /tmp/proof.done
          sleep 1
          scrot -z artifacts/terminal.png

          kill "$XTERM_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

          file artifacts/terminal.png

      - name: Upload real terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: real-terminal-proof
          path: |
            artifacts/terminal.png
            artifacts/proof.txt
          if-no-files-found: error
          retention-days: 30
