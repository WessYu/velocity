name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11.5.1
      - run: npm ci --ignore-scripts

      - name: Resolve and validate release identity
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          requested_version="${REQUESTED_VERSION:-$package_version}"
          if [[ "$requested_version" != "$package_version" ]]; then
            echo "Requested version $requested_version does not match package.json $package_version" >&2
            exit 1
          fi
          node -e 'const v=process.argv[1]; if(!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(v)) process.exit(1)' "$package_version"
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.event.head_commit.message }}" != release:\ v${package_version}* ]]; then
            echo "Automatic publishing is allowed only from an explicit release: v${package_version} main commit" >&2
            exit 1
          fi
          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Validate exact changelog section and release notes
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          heading_count=$(grep -Ec "^## ${VERSION} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || true)
          test "$heading_count" -eq 1 || { echo "Expected exactly one changelog heading for ${VERSION}" >&2; exit 1; }
          awk -v version="$VERSION" '
            $0 ~ "^## " version " - [0-9]{4}-[0-9]{2}-[0-9]{2}$" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          grep -Eq '[^[:space:]]' release-notes.md || { echo "Release notes for ${VERSION} are empty" >&2; exit 1; }
          grep -Eq '^- ' release-notes.md || { echo "Release notes for ${VERSION} contain no change entries" >&2; exit 1; }

      - name: Reject an existing version from another commit
        id: registry
        shell: bash
        env:
          PACKAGE: ${{ steps.release.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          published=$(npm view "${PACKAGE}@${VERSION}" version --json 2>/dev/null || true)
          if [[ -n "$published" && "$published" != "null" ]]; then
            git_head=$(npm view "${PACKAGE}@${VERSION}" gitHead --json 2>/dev/null | tr -d '"' || true)
            if [[ "$git_head" != "$GITHUB_SHA" ]]; then
              echo "${PACKAGE}@${VERSION} already exists from gitHead ${git_head:-unknown}, not $GITHUB_SHA" >&2
              exit 1
            fi
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the complete package gate
        run: npm run check

      - name: Install the playwright-core Chromium revision
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Resolve exact Chromium executable
        shell: bash
        run: echo "CHROME_PATH=$(node --input-type=module -e \"import { chromium } from 'playwright-core'; process.stdout.write(chromium.executablePath())\")" >> "$GITHUB_ENV"
      - name: Browser smoke before publish
        shell: bash
        run: |
          mkdir -p .velocity-release-tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .velocity-release-tls/key.pem -out .velocity-release-tls/cert.pem -days 1 -subj "/CN=127.0.0.1" >/dev/null 2>&1
          VELOCITY_TLS_KEY=.velocity-release-tls/key.pem VELOCITY_TLS_CERT=.velocity-release-tls/cert.pem node scripts/browser-smoke.js
          node scripts/validate-schemas.js schemas/load-report.schema.json load-smoke.json

      - name: Dry-run and build the exact tarball
        id: pack
        shell: bash
        env:
          PACKAGE: ${{ steps.release.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack-dry-run.json
          npm pack --json > pack.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dry = JSON.parse(fs.readFileSync('pack-dry-run.json', 'utf8'))[0];
          const packed = JSON.parse(fs.readFileSync('pack.json', 'utf8'))[0];
          const paths = value => value.files.map(file => file.path).sort();
          if (JSON.stringify(paths(dry)) !== JSON.stringify(paths(packed))) throw new Error('npm pack --dry-run and the real tarball contain different file sets');
          if (dry.unpackedSize !== packed.unpackedSize) throw new Error('npm pack --dry-run and the real tarball have different unpacked sizes');
          fs.writeFileSync('package-file.txt', packed.filename);
          NODE
          package_file=$(cat package-file.txt)
          test -s "$package_file"
          tar -xOf "$package_file" package/package.json > packed-package.json
          test "$(node -p "require('./packed-package.json').name")" = "$PACKAGE"
          test "$(node -p "require('./packed-package.json').version")" = "$VERSION"
          tar -tzf "$package_file" > tarball-files.txt
          grep -qx 'package/bin/velocity.js' tarball-files.txt
          grep -qx 'package/src/index.js' tarball-files.txt
          grep -qx 'package/src/index.d.ts' tarball-files.txt
          grep -qx 'package/schemas/load-report.schema.json' tarball-files.txt
          grep -qx 'package/LICENSE' tarball-files.txt
          if grep -Eq '^package/(test|scripts|node_modules|coverage|\.velocity)(/|$)' tarball-files.txt; then
            echo "Tarball contains internal or temporary files" >&2
            exit 1
          fi
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"

      - name: Install and consume the exact tarball outside the repository
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGE_FILE: ${{ steps.pack.outputs.package_file }}
        run: |
          set -euo pipefail
          package_path="$PWD/$PACKAGE_FILE"
          temp_dir=$(mktemp -d)
          cd "$temp_dir"
          npm init -y >/dev/null
          npm install --ignore-scripts "$package_path"
          test "$(npx velocity --version)" = "$VERSION"
          printf 'export const value = 1;\n' > index.js
          npx velocity analyze . --format json > report.json
          node -e 'const report=require("./report.json"); if(report.schemaVersion!==1) process.exit(1)'
          printf 'import { getRuleCatalog } from "@wess2001/velocity"; if (!getRuleCatalog().length) process.exit(1);\n' > consumer.mjs
          node consumer.mjs

      - name: Publish the validated tarball
        if: steps.registry.outputs.already_published != 'true'
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.package_file }}
        run: npm publish "$PACKAGE_FILE" --access public

      - name: Verify npm provenance identity
        shell: bash
        env:
          PACKAGE: ${{ steps.release.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            git_head=$(npm view "${PACKAGE}@${VERSION}" gitHead --json 2>/dev/null | tr -d '"' || true)
            [[ "$git_head" == "$GITHUB_SHA" ]] && exit 0
            sleep 5
          done
          echo "Published npm gitHead does not match $GITHUB_SHA" >&2
          exit 1

      - name: Create GitHub Release from the validated notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing_target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
            [[ "$existing_target" == "$GITHUB_SHA" || "$existing_target" == "main" ]] || { echo "Existing release $tag targets $existing_target" >&2; exit 1; }
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md
          fi
