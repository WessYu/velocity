<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Velocity CLI terminal</title>
  <desc id="desc">Dark cinematic terminal scene showing npx @wess2001/velocity analyze dot.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020407"/>
      <stop offset="0.48" stop-color="#050a10"/>
      <stop offset="1" stop-color="#010204"/>
    </linearGradient>

    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0d2740" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#07111d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="terminalFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c1621" stop-opacity="0.72"/>
      <stop offset="0.58" stop-color="#0b141f" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#05090f" stop-opacity="0.22"/>
    </linearGradient>

    <pattern id="scanlines" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#ffffff" opacity="0.012"/>
    </pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="875" cy="610" rx="720" ry="260" fill="url(#blueGlow)"/>
  <rect width="1600" height="900" fill="url(#scanlines)" opacity="0.9"/>

  <!-- upper screen darkness -->
  <rect x="0" y="0" width="1600" height="410" fill="#010204" opacity="0.74"/>
  <rect x="0" y="0" width="1600" height="900" fill="none" stroke="#0c1118" stroke-width="1" opacity="0.35"/>

  <!-- terminal panel photographed at an angle -->
  <g transform="translate(-45 40) rotate(-3 800 520) skewX(-4)" filter="url(#shadow)">
    <rect x="20" y="390" width="1660" height="330" fill="url(#terminalFade)"/>
    <line x1="0" y1="390" x2="1660" y2="390" stroke="#172431" stroke-width="1.3" opacity="0.55"/>

    <!-- tabs -->
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" letter-spacing="0.4">
      <text x="85" y="485" fill="#d4dbe4" opacity="0.32" filter="url(#soft)">PROBLEMS</text>
      <text x="370" y="485" fill="#d9e1eb" opacity="0.72" filter="url(#glow)">OUTPUT</text>
      <text x="610" y="485" fill="#e6c64f" font-weight="700" filter="url(#glow)">TERMINAL</text>
      <text x="850" y="485" fill="#e0e7ef" opacity="0.8" filter="url(#glow)">DEBUG CONSOLE</text>
      <rect x="608" y="505" width="164" height="4" rx="2" fill="#e6c64f" opacity="0.95"/>
    </g>

    <!-- command -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="42" filter="url(#glow)">
      <text x="92" y="610" fill="#eef4fb" font-weight="700">PS D:\velocity&gt;</text>
      <text x="535" y="610" fill="#e8c74d" font-weight="700">npx</text>
      <text x="645" y="610" fill="#f1f5f8">@wess2001/velocity analyze .</text>
      <rect x="1280" y="571" width="18" height="46" fill="#eef3f7" opacity="0.96"/>
    </g>

    <line x1="1140" y1="700" x2="1595" y2="700" stroke="#d8e0e8" stroke-width="2" opacity="0.32"/>
  </g>

  <!-- lens / monitor falloff -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#blueGlow)" opacity="0.05"/>
  <rect x="0" y="0" width="1600" height="900" fill="#000" opacity="0.04"/>
</svg>
